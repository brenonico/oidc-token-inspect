name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build UMD bundle
        run: npm run build

  dotnet:
    name: .NET (xUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - working-directory: dotnet
        run: dotnet restore TokenInspect.slnx
      - working-directory: dotnet
        run: dotnet test TokenInspect.slnx --no-restore --verbosity normal
